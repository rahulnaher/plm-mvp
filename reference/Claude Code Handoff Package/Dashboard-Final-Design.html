document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 src: url(\"1a7ef652-0c41-4761-b94a-7a4a93ffa2ef\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ── Color system ──────────────────────────────────────────\n   Source of truth: Mars Petcare v2 theme (proposal style guide).\n   Red-led palette on a warm floral-white canvas, with teal +\n   yellow support accents and a warm-gray ink. Base first,\n   then semantic aliases. */\n\n:root {\n  /* Canvas / surfaces — warm floral white */\n  --cream-50:  #FFFAF0;   /* lt2 — primary canvas */\n  --cream-100: #FBF3E6;   /* sunken / alt rows */\n  --cream-200: #F1E6D4;   /* hairline tint on cream */\n  --white:     #FFFFFF;   /* lt1 */\n\n  /* Brand red — the dominant structural + functional color */\n  --red-900: #7A0303;     /* deepest */\n  --red-800: #A80404;     /* accent1 — PRIMARY structural anchor */\n  --red-600: #DA291C;     /* accent2 — active / highlight / focal */\n  --red-500: #FF1414;     /* dk2 — pure red, use sparingly */\n  --coral-400: #FC6363;   /* accent3 — soft red / illustration */\n  --coral-200: #FFD2D2;\n  --red-100: #FBE3E1;\n  --red-50:  #FDF1F0;\n  --crimson-600: #DB033B; /* accent4 — alt magenta-red highlight */\n\n  /* Support accents */\n  --teal-500:   #00D7B9;  /* accent5 — data / positive */\n  --teal-100:   #D2F7F1;\n  --yellow-400: #FFDC00;  /* accent6 — emphasis / charts */\n  --yellow-100: #FFF4CC;\n  --pet-orange: #FF6500;  /* illustration accent (dog silhouette) */\n\n  /* Warm neutrals / ink */\n  --ink-900: #2A2622;     /* near-black warm */\n  --ink-700: #3C3C3C;     /* icon / strong gray */\n  --ink-500: #736E6E;     /* dk1 — body muted (warm gray) */\n  --ink-400: #9A9492;\n  --ink-300: #C4BEBA;\n  --ink-200: #E4DDD5;     /* warm hairline */\n  --ink-100: #F0EBE3;\n\n  /* ── Semantic aliases ─────────────────────────────────── */\n  --canvas:           var(--cream-50);\n  --canvas-alt:       var(--cream-100);\n  --surface-card:     var(--white);\n  --surface-anchor:   var(--red-800);   /* dark structural panels */\n  --surface-sunken:   var(--cream-100);\n\n  --text-strong:      var(--ink-900);\n  --text-body:        var(--ink-700);\n  --text-muted:       var(--ink-500);\n  --text-on-anchor:   var(--cream-50);\n  --text-on-red:      var(--white);\n\n  --accent:           var(--red-600);   /* active / functional */\n  --accent-strong:    var(--red-800);   /* deep structural */\n  --accent-soft:      var(--red-100);\n  --anchor:           var(--red-800);\n  --anchor-strong:    var(--red-900);\n\n  --support-teal:     var(--teal-500);\n  --support-yellow:   var(--yellow-400);\n\n  --border-hairline:  var(--ink-100);\n  --border-strong:    var(--ink-200);\n  --border-on-cream:  var(--cream-200);\n\n  --focus-ring:       var(--red-600);\n}\n<\u002Fstyle>\n  <style>/* ── Typography ────────────────────────────────────────────\n   One family — Mulish (substitute for Mars Centra). Display uses\n   Extrabold (800); body regular/medium; labels are uppercase and\n   tracked in the same family. No secondary mono — the brand sets\n   everything in Centra. */\n\n:root {\n  --font-display: 'Mulish', system-ui, sans-serif;\n  --font-body:    'Mulish', system-ui, sans-serif;\n  --font-label:   'Mulish', system-ui, sans-serif;\n  /* back-compat alias (older cards referenced --font-mono) */\n  --font-mono:    'Mulish', system-ui, sans-serif;\n\n  /* Weights */\n  --fw-light:     300; /* @kind other */\n  --fw-regular:   400; /* @kind other */\n  --fw-medium:    500; /* @kind other */\n  --fw-semibold:  600; /* @kind other */\n  --fw-bold:      700; /* @kind other */\n  --fw-extrabold: 800; /* @kind other */\n  --fw-black:     900; /* @kind other */\n\n  /* Type scale (rem, 16px base) */\n  --fs-display-xl: 4.5rem;   /* 72 — cover wordmark / hero numerals */\n  --fs-display-l:  3.25rem;  /* 52 — slide titles */\n  --fs-display-m:  2.5rem;   /* 40 */\n  --fs-h1:         2rem;     /* 32 */\n  --fs-h2:         1.5rem;   /* 24 */\n  --fs-h3:         1.25rem;  /* 20 */\n  --fs-body-lg:    1.125rem; /* 18 */\n  --fs-body:       1rem;     /* 16 */\n  --fs-body-sm:    0.875rem; /* 14 */\n  --fs-label:      0.75rem;  /* 12 — eyebrow / caps label */\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2;  /* @kind other */\n  --lh-normal:  1.45; /* @kind other */\n  --lh-relaxed: 1.6;  /* @kind other */\n\n  /* Letter spacing */\n  --ls-tight:  -0.015em; /* @kind other */\n  --ls-normal: 0;        /* @kind other */\n  --ls-label:  0.12em;   /* @kind other */   /* uppercase eyebrows */\n}\n<\u002Fstyle>\n  <style>/* ── Spacing ───────────────────────────────────────────────\n   8px base grid. Generous outer margins for breathing room. */\n\n:root {\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   24px;\n  --space-6:   32px;\n  --space-7:   48px;\n  --space-8:   64px;\n  --space-9:   96px;\n  --space-10: 128px;\n\n  /* Layout */\n  --gutter:        32px;   /* grid card gap */\n  --margin-page:   64px;   /* slide / page outer margin */\n  --margin-tight:  40px;\n  --maxw-content: 1200px;\n  --split-gap:     56px;   /* gap in the left/right split pattern */\n}\n<\u002Fstyle>\n  <style>/* ── Radius & shadow ───────────────────────────────────────\n   Soft, confident corners. Shadows are diffuse and warm-tinted,\n   never harsh — cards float gently on the cream canvas. */\n\n:root {\n  /* Corner radii */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* Elevation — warm-tinted, diffuse */\n  --shadow-sm:  0 1px 2px rgba(42, 38, 34, 0.05);\n  --shadow-md:  0 4px 16px rgba(122, 60, 30, 0.08);\n  --shadow-lg:  0 12px 36px rgba(122, 40, 20, 0.10);\n  --shadow-xl:  0 24px 64px rgba(80, 20, 12, 0.14);\n\n  /* Focal / accent glow (used sparingly on red metrics) */\n  --shadow-accent: 0 10px 30px rgba(218, 41, 28, 0.20);\n\n  /* Border widths */\n  --bw-hairline: 1px;\n  --bw-strong:   2px;\n  --bw-anchor:   4px;   /* structural accent rule */\n}\n<\u002Fstyle>\n  <style>/* ── Base / reset ──────────────────────────────────────────\n   Minimal element defaults so specimen cards and kits inherit\n   the brand voice without extra setup. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--canvas);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  margin: 0;\n}\n\n/* Uppercase eyebrow / section label */\n.eyebrow {\n  font-family: var(--font-label);\n  font-size: var(--fs-label);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  font-weight: var(--fw-medium);\n  color: var(--accent);\n}\n\na { color: var(--anchor); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n::selection { background: var(--coral-200); color: var(--accent-strong); }\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════\n   Mars Petcare Design System — global entry point.\n   Consumers link this one file. Keep it as @import lines only.\n   ════════════════════════════════════════════════════════════ */\n\n/* ── Webfonts ──────────────────────────────────────────────\n   Mars Petcare's brand face is the proprietary \"Mars Centra\"\n   (Extrabold for display, regular/medium for text). That binary\n   is not licensed here, so we substitute the closest free\n   geometric humanist sans on Google Fonts:\n     • Mulish  → display + body + labels (clean geometric grotesque,\n   #FFFAF0;   /* lt2 — primary canvas */\n  --cream-100: #FBF3E6;   /* sunken / alt rows */\n  --cream-200: #F1E6D4;   /* hairline tint on cream */\n  --white:     #FFFFFF;   /* lt1 */\n\n  /* Brand red — the dominant structural + functional color */\n  --red-900: #7A0303;     /* deepest */\n  --red-800: #A80404;     /* accent1 — PRIMARY structural anchor */\n  --red-600: #DA291C;     /* accent2 — active / highlight / focal */\n  --red-500: #FF1414;     /* dk2 — pure red, use sparingly */\n  --coral-400: #FC6363;   /* accent3 — soft red / illustration */\n  --coral-200: #FFD2D2;\n  --red-100: #FBE3E1;\n  --red-50:  #FDF1F0;\n  --crimson-600: #DB033B; /* accent4 — alt magenta-red highlight */\n\n  /* Support accents */\n  --teal-500:   #00D7B9;  /* accent5 — data / positive */\n  --teal-100:   #D2F7F1;\n  --yellow-400: #FFDC00;  /* accent6 — emphasis / charts */\n  --yellow-100: #FFF4CC;\n  --pet-orange: #FF6500;  /* illustration accent (dog silhouette) */\n\n  /* Warm neutrals / ink */\n  --ink-900: #2A2622;     /* near-black warm */\n  --ink-700: #3C3C3C;     /* icon / strong gray */\n  --ink-500: #736E6E;     /* dk1 — body muted (warm gray) */\n  --ink-400: #9A9492;\n  --ink-300: #C4BEBA;\n  --ink-200: #E4DDD5;     /* warm hairline */\n  --ink-100: #F0EBE3;\n\n  /* ── Semantic aliases ─────────────────────────────────── */\n  --canvas:           var(--cream-50);\n  --canvas-alt:       var(--cream-100);\n  --surface-card:     var(--white);\n  --surface-anchor:   var(--red-800);   /* dark structural panels */\n  --surface-sunken:   var(--cream-100);\n\n  --text-strong:      var(--ink-900);\n  --text-body:        var(--ink-700);\n  --text-muted:       var(--ink-500);\n  --text-on-anchor:   var(--cream-50);\n  --text-on-red:      var(--white);\n\n  --accent:           var(--red-600);   /* active / functional */\n  --accent-strong:    var(--red-800);   /* deep structural */\n  --accent-soft:      var(--red-100);\n  --anchor:           var(--red-800);\n  --anchor-strong:    var(--red-900);\n\n  --support-teal:     var(--teal-500);\n  --support-yellow:   var(--yellow-400);\n\n  --border-hairline:  var(--ink-100);\n  --border-strong:    var(--ink-200);\n  --border-on-cream:  var(--cream-200);\n\n  --focus-ring:       var(--red-600);\n}\n\n/* ── Typography ────────────────────────────────────────────\n   One family — Mulish (substitute for Mars Centra). Display uses\n   Extrabold (800); body regular/medium; labels are uppercase and\n   tracked in the same family. No secondary mono — the brand sets\n   everything in Centra. */\n\n:root {\n  --font-display: 'Mulish', system-ui, sans-serif;\n  --font-body:    'Mulish', system-ui, sans-serif;\n  --font-label:   'Mulish', system-ui, sans-serif;\n  /* back-compat alias (older cards referenced --font-mono) */\n  --font-mono:    'Mulish', system-ui, sans-serif;\n\n  /* Weights */\n  --fw-light:     300; /* @kind other */\n  --fw-regular:   400; /* @kind other */\n  --fw-medium:    500; /* @kind other */\n  --fw-semibold:  600; /* @kind other */\n  --fw-bold:      700; /* @kind other */\n  --fw-extrabold: 800; /* @kind other */\n  --fw-black:     900; /* @kind other */\n\n  /* Type scale (rem, 16px base) */\n  --fs-display-xl: 4.5rem;   /* 72 — cover wordmark / hero numerals */\n  --fs-display-l:  3.25rem;  /* 52 — slide titles */\n  --fs-display-m:  2.5rem;   /* 40 */\n  --fs-h1:         2rem;     /* 32 */\n  --fs-h2:         1.5rem;   /* 24 */\n  --fs-h3:         1.25rem;  /* 20 */\n  --fs-body-lg:    1.125rem; /* 18 */\n  --fs-body:       1rem;     /* 16 */\n  --fs-body-sm:    0.875rem; /* 14 */\n  --fs-label:      0.75rem;  /* 12 — eyebrow / caps label */\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2;  /* @kind other */\n  --lh-normal:  1.45; /* @kind other */\n  --lh-relaxed: 1.6;  /* @kind other */\n\n  /* Letter spacing */\n  --ls-tight:  -0.015em; /* @kind other */\n  --ls-normal: 0;        /* @kind other */\n  --ls-label:  0.12em;   /* @kind other */   /* uppercase eyebrows */\n}\n\n/* ── Spacing ───────────────────────────────────────────────\n   8px base grid. Generous outer margins for breathing room. */\n\n:root {\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   24px;\n  --space-6:   32px;\n  --space-7:   48px;\n  --space-8:   64px;\n  --space-9:   96px;\n  --space-10: 128px;\n\n  /* Layout */\n  --gutter:        32px;   /* grid card gap */\n  --margin-page:   64px;   /* slide / page outer margin */\n  --margin-tight:  40px;\n  --maxw-content: 1200px;\n  --split-gap:     56px;   /* gap in the left/right split pattern */\n}\n\n/* ── Radius & shadow ───────────────────────────────────────\n   Soft, confident corners. Shadows are diffuse and warm-tinted,\n   never harsh — cards float gently on the cream canvas. */\n\n:root {\n  /* Corner radii */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* Elevation — warm-tinted, diffuse */\n  --shadow-sm:  0 1px 2px rgba(42, 38, 34, 0.05);\n  --shadow-md:  0 4px 16px rgba(122, 60, 30, 0.08);\n  --shadow-lg:  0 12px 36px rgba(122, 40, 20, 0.10);\n  --shadow-xl:  0 24px 64px rgba(80, 20, 12, 0.14);\n\n  /* Focal / accent glow (used sparingly on red metrics) */\n  --shadow-accent: 0 10px 30px rgba(218, 41, 28, 0.20);\n\n  /* Border widths */\n  --bw-hairline: 1px;\n  --bw-strong:   2px;\n  --bw-anchor:   4px;   /* structural accent rule */\n}\n\n/* ── Base / reset ──────────────────────────────────────────\n   Minimal element defaults so specimen cards and kits inherit\n   the brand voice without extra setup. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-normal);\n  color: var(--text-body);\n  background: var(--canvas);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-tight);\n  margin: 0;\n}\n\n/* Uppercase eyebrow / section label */\n.eyebrow {\n  font-family: var(--font-label);\n  font-size: var(--fs-label);\n  letter-spacing: var(--ls-label);\n  text-transform: uppercase;\n  font-weight: var(--fw-medium);\n  color: var(--accent);\n}\n\na { color: var(--anchor); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n::selection { background: var(--coral-200); color: var(--accent-strong); }\n\n<\u002Fstyle>\n  <script src=\"a3e1c63b-ed99-4ded-8684-f86e1eee94e0\"><\u002Fscript>\n  <style>\n    /* Client override: blue enterprise palette (FRAD-style), replacing the DS red-led theme by request */\n    :root {\n      --red-900: #0B2A4A; --red-800: #123A6B; --red-600: #1E6FD9; --red-500: #2F80ED;\n      --coral-400: #5FA8F5; --coral-200: #D6E9FE; --red-100: #E8F1FD; --red-50: #F1F7FE;\n      --crimson-600: #0E8FA8; --teal-500: #0E8FA8; --teal-100: #DCF2F6;\n      --cream-50: #F4F7FB; --cream-100: #EAF1FA; --cream-200: #DCE8F5; --border-on-cream: #DCE8F5;\n      --accent: var(--red-600); --accent-strong: var(--red-800); --anchor: var(--red-800); --anchor-strong: var(--red-900);\n      --surface-anchor: var(--red-800); --focus-ring: var(--red-600);\n    }\n    html, body { margin: 0; height: 100%; overflow: hidden; }\n    a { color: var(--accent-strong); text-decoration: none; }\n    a:hover { color: var(--red-600); text-decoration: underline; }\n    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: var(--radius-md); font-size: var(--fs-body-sm); font-weight: 600; color: rgba(255,250,240,0.72); cursor: pointer; }\n    .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }\n    .nav-item.active { background: var(--red-800); color: #fff; }\n    .nav-item svg { flex-shrink: 0; }\n    .toggle-pill { padding: 6px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; border: 1.5px solid var(--border-strong); background: var(--white); color: var(--text-muted); cursor: pointer; }\n    .toggle-pill.on { background: var(--red-800); border-color: var(--red-800); color: #fff; }\n    .kpi-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 18px 20px; flex: 1; min-width: 0; }\n    .kpi-val { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--text-strong); }\n    .kpi-label { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; }\n    .alert-box { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius-md); align-items: flex-start; }\n    .tile-card { border-radius: var(--radius-lg); padding: 20px; cursor: pointer; box-shadow: var(--shadow-sm); transition: box-shadow 0.15s; }\n    .tile-card:hover { box-shadow: var(--shadow-md); }\n    table.hub-table { width: 100%; border-collapse: collapse; }\n    table.hub-table th { text-align: left; font-family: var(--font-label); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 0 12px 10px 0; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }\n    table.hub-table td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--border-hairline); font-size: var(--fs-body-sm); color: var(--text-body); }\n    select.role-select { appearance: none; background: var(--red-50); color: var(--red-800); border: 1px solid var(--coral-200); border-radius: var(--radius-pill); padding: 6px 32px 6px 14px; font-family: var(--font-label); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }\n    .filter-dd-btn { padding: 8px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong); background: var(--white); font-size: 0.85rem; font-weight: 600; color: var(--text-strong); cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }\n    .filter-dd-btn:hover { border-color: var(--red-600); }\n    .filter-dd-panel { position: absolute; top: calc(100% + 6px); left: 0; background: var(--white); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 12px; min-width: 190px; z-index: 20; }\n    .filter-dd-panel label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; padding: 6px 4px; cursor: pointer; }\n    .dd-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-hairline); }\n    .dd-btn-cancel { padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--white); font-size: 0.8rem; cursor: pointer; }\n    .dd-btn-apply { padding: 6px 12px; border-radius: var(--radius-sm); border: none; background: var(--red-600); color: #fff; font-size: 0.8rem; font-weight: 700; cursor: pointer; }\n    .qb-check { display: flex; align-items: center; gap: 8px; font-size: 0.83rem; padding: 4px 0; cursor: pointer; color: var(--text-body); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"display:flex; height:100vh; background:var(--canvas); font-family:var(--font-body);\">\n\n  <aside style=\"width:236px; flex-shrink:0; background:var(--red-900); display:flex; flex-direction:column; padding:20px 12px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; padding:8px 8px 20px;\">\n      <div style=\"width:32px; height:32px; border-radius:var(--radius-sm); background:var(--red-600); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800;\">M<\u002Fdiv>\n      <div style=\"color:#fff; font-family:var(--font-display); font-weight:800; font-size:1.05rem;\">Mars PLM<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"nav-item {{ hubActiveClass }}\" onclick=\"{{ goHub }}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg>\n      PLM Hub\n    <\u002Fdiv>\n    <div class=\"nav-item {{ explorerActiveClass }}\" onclick=\"{{ goExplorer }}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"1.5\"><\u002Frect><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><line x1=\"9\" y1=\"10\" x2=\"9\" y2=\"20\"><\u002Fline><\u002Fsvg>\n      Specification Explorer\n    <\u002Fdiv>\n\n    <div style=\"font-family:var(--font-label); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--coral-400); padding:20px 16px 6px;\">Analysis<\u002Fdiv>\n\n    <div class=\"nav-item {{ traceActiveClass }}\" onclick=\"{{ goTrace }}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"5\" r=\"2.5\"><\u002Fcircle><circle cx=\"5\" cy=\"19\" r=\"2.5\"><\u002Fcircle><circle cx=\"19\" cy=\"19\" r=\"2.5\"><\u002Fcircle><path d=\"M12 7.5V13M12 13L5 16.5M12 13l7 3.5\"><\u002Fpath><\u002Fsvg>\n      Top-Down Traceability\n    <\u002Fdiv>\n    <div class=\"nav-item {{ impactActiveClass }}\" onclick=\"{{ goImpact }}\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 19V5M12 5l-6 6M12 5l6 6\"><\u002Fpath><\u002Fsvg>\n      Bottom-Up Impact\n 'EU', segment: 'Petcare', plant: 'Plant 2020', status: 'Draft', cost: 5.60, formPct: 100 },\n  { id: 'GBL-FG-SNICKERS-50G', type: 'FERT', name: 'Snickers Single Bar (50g)', region: 'APAC', segment: 'Snacking', plant: 'Plant 3010', status: 'Active', cost: 1.10, formPct: 100 },\n  // fills so every hero region has a packaging + print pair\n  { id: 'PK-BOR-RICE-EU-01', type: 'VERP', name: 'Rice Pouch Packaging (EU)', region: 'EU', segment: 'Food', plant: 'Plant 2050', status: 'Active', cost: 0.06, formPct: 1 },\n  { id: 'PS-BOR-AP-01', type: 'PRNT', name: \"Ben's Original APAC Print Spec\", region: 'APAC', segment: 'Food', plant: 'Plant 3020', status: 'Active', cost: 0.03, formPct: 1 },\n  { id: 'PS-MMS-EU-01', type: 'PRNT', name: \"M&M's Sharing Pouch EU Print Spec\", region: 'EU', segment: 'Snacking', plant: 'Plant 2050', status: 'Active', cost: 0.04, formPct: 1 },\n];\n\nconst ALLERGENS = {\n  'GBL-ING-WHEAT-WHL-01': 'Gluten (Wheat)',\n  'ROH-MILK-PWD-02': 'Milk',\n  'ROH-COCOA-0102': 'Soy Lecithin (processing aid)',\n};\n\nfunction leaf(id, type, name, qty, pct, totalWeight) {\n  return { id, type, name, qty, levelPct: pct, levelKg: totalWeight * pct / 100, children: [] };\n}\nfunction node(id, type, name, qty, pct, totalWeight, children) {\n  return { id, type, name, qty, levelPct: pct, levelKg: totalWeight * pct / 100, children };\n}\nfunction buildPedigreeTree(rootId, packId, packName, printId, printName, w) {\n  return node(rootId, 'FERT', 'Pedigree Adult Dry Chicken & Rice (15kg)', '1 EA', 100, w, [\n    leaf(packId, 'VERP', packName, '1 EA', 1, w),\n    leaf(printId, 'PRNT', printName, '1 EA', 1, w),\n    node('RCP-PED-CHICKEN-01', 'REAL_SUB', 'Pedigree Adult Chicken Base Formula', '15 KG', 100, w, [\n      leaf('GBL-ING-CHICK-MEAL-01', 'ROH', 'Standard Poultry/Chicken Meal', '38 KG', 38, w),\n      leaf('GBL-ING-WHEAT-WHL-01', 'ROH', 'Whole Grain Wheat (Feed Grade)', '28 KG', 28, w),\n      node('SUB-RCP-VIT-01', 'SUB_RCP', 'Global Canine Vitamin & Mineral Premix', '6 KG', 6, w, [\n        leaf('GBL-ING-VITMIN-A-01', 'ROH', 'Vitamin A Premix Component', '2 KG', 2, w),\n        leaf('GBL-ING-VITMIN-B-01', 'ROH', 'Mineral Chelate Blend', '4 KG', 4, w),\n      ]),\n    ]),\n  ]);\n}\nfunction buildMMSTree(rootId, packId, packName, printId, printName, w) {\n  return node(rootId, 'FERT', \"M&M's Milk Chocolate Sharing Pouch (250g)\", '1 EA', 100, w, [\n    leaf(packId, 'VERP', packName, '1 EA', 1, w),\n    leaf(printId, 'PRNT', printName, '1 EA', 1, w),\n    node('RC-MMS-SHARE-US-01', 'REAL_SUB', \"M&M's Milk Chocolate Master Recipe\", '0.25 KG', 100, w, [\n      leaf('ROH-COCOA-0102', 'ROH', 'Cocoa Mass (Fair Trade, Rev.2)', '34%', 34, w),\n      leaf('ROH-MILK-PWD-02', 'ROH', 'Whole Milk Powder', '18%', 18, w),\n      leaf('ROH-SUGAR-REF-01', 'ROH', 'Refined Cane Sugar', '20%', 20, w),\n      leaf('SR-MMS-SHELL-US', 'SUB_RCP', 'Candy Shell Sub-Recipe', '12%', 12, w),\n      leaf('SR-MMS-COAT-EU', 'SUB_RCP', 'Chocolate Coating Sub-Recipe', '22%', 22, w),\n    ]),\n  ]);\n}\nfunction buildBORTree(rootId, packId, packName, printId, printName, w) {\n  return node(rootId, 'FERT', \"Ben's Original Express Rice (250g)\", '1 EA', 100, w, [\n    leaf(packId, 'VERP', packName, '1 EA', 1, w),\n    leaf(printId, 'PRNT', printName, '1 EA', 1, w),\n    node('RC-BOR-RICE-EU-01', 'REAL_SUB', \"Ben's Original Rice Master Recipe\", '0.25 KG', 100, w, [\n      leaf('ROH-RICE-JASMINE-01', 'ROH', 'Jasmine Rice', '78%', 78, w),\n      node('SR-BOR-SEASON-01', 'SUB_RCP', 'Seasoning Sub-Recipe', '8%', 8, w, [\n        leaf('ROH-SPICE-BLEND-04', 'ROH', 'Spice Blend Concentrate', '5%', 5, w),\n      ]),\n    ]),\n  ]);\n}\nconst BOM_TREES = {\n  'GBL-FG-PED-15K-US': buildPedigreeTree('GBL-FG-PED-15K-US', 'SPEC-NA-8812', 'Multi-wall Paper Bag (15kg, NA)', 'PSPEC-NA-5511', 'Pedigree Adult Dry 15kg US Artwork', 15),\n  'GBL-FG-PED-15K-EU': buildPedigreeTree('GBL-FG-PED-15K-EU', 'SPEC-EU-8813', 'Multi-wall Paper Bag (15kg, EU)', 'PSPEC-EU-5512', 'Pedigree Adult Dry 15kg EU Artwork', 15),\n  'GBL-FG-PED-15K-AP': buildPedigreeTree('GBL-FG-PED-15K-AP', 'SPEC-AP-8814', 'Multi-wall Paper Bag (15kg, APAC)', 'PSPEC-AP-5513', 'Pedigree Adult Dry 15kg APAC Artwork', 15),\n  'GBL-FG-MMS-US': buildMMSTree('GBL-FG-MMS-US', 'PK-MMS-POUCH-US', 'Sharing Pouch Flexible Film (NA)', 'PS-MMS-US-01', \"M&M's Sharing Pouch US Print Spec\", 0.25),\n  'GBL-FG-MMS-EU': buildMMSTree('GBL-FG-MMS-EU', 'PK-MMS-POUCH-EU', 'Sharing Pouch Flexible Film (EU)', 'PS-MMS-EU-01', \"M&M's Sharing Pouch EU Print Spec\", 0.25),\n  'GBL-FG-BOR-EU': buildBORTree('GBL-FG-BOR-EU', 'PK-BOR-RICE-EU-01', 'Rice Pouch Packaging (EU)', 'PS-BOR-EU-01', \"Ben's Original EU Print Spec\", 0.25),\n  'GBL-FG-BOR-AP': buildBORTree('GBL-FG-BOR-AP', 'PK-BOR-RICE-APAC-002', 'Rice Pouch Packaging (APAC)', 'PS-BOR-AP-01', \"Ben's Original APAC Print Spec\", 0.25),\n};\nfunction countTree(n, c) {\n  c.total++;\n  if (n.type === 'ROH') c.raw++;\n  if (n.type === 'VERP' || n.type === 'PRNT') c.packaging++;\n  if (n.type === 'SUB_RCP' || n.type === 'REAL_SUB') c.subrecipes++;\n  (n.children || []).forEach(ch => countTree(ch, c));\n}\nfunction flattenTree(n, depth, collapsed, rows) {\n  rows.push({ node: n, depth });\n  if (collapsed.has(n.id)) return;\n  (n.children || []).forEach(ch => flattenTree(ch, depth + 1, collapsed, rows));\n}\nfunction searchImpact(n, sourceId, ancestors, out) {\n  if (n.id === sourceId) {\n    let recipe = null;\n    for (let i = ancestors.length - 1; i >= 0; i--) { if (ancestors[i].type === 'REAL_SUB') { recipe = ancestors[i]; break; } }\n    if (!recipe && n.type === 'REAL_SUB') recipe = n;\n    out.push({ recipe, node: n });\n  }\n  (n.children || []).forEach(c => searchImpact(c, sourceId, ancestors.concat([n]), out));\n}\nfunction collectNonFertNodes(n, map) {\n  if (n.type !== 'FERT') map.set(n.id, { id: n.id, type: n.type, name: n.name });\n  (n.children || []).forEach(c => collectNonFertNodes(c, map));\n}\nfunction findNodeById(id) {\n  for (const tree of Object.values(BOM_TREES)) {\n    const found = (function walk(n) { if (n.id === id) return n; for (const c of (n.children || [])) { const r = walk(c); if (r) return r; } return null; })(tree);\n    if (found) return found;\n  }\n  return null;\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'hub', persona: 'rd',\n    appliedSegments: new Set(SEGMENTS), appliedRegions: new Set(REGIONS),\n    pendingSegments: new Set(SEGMENTS), pendingRegions: new Set(REGIONS),\n    openDropdown: null,\n    explorerFreeTextPending: '', explorerFreeTextApplied: '',\n    explorerTypesPending: new Set(ALL_TYPES), explorerTypesApplied: new Set(ALL_TYPES),\n    explorerRegionsPending: new Set(ALL_EXP_REGIONS), explorerRegionsApplied: new Set(ALL_EXP_REGIONS),\n    explorerSegmentsPending: new Set(SEGMENTS), explorerSegmentsApplied: new Set(SEGMENTS),\n    explorerStatusPending: new Set(ALL_STATUS), explorerStatusApplied: new Set(ALL_STATUS),\n    explorerSelectedIds: new Set(), explorerOpenMenuId: null, explorerLastDrillTarget: null,\n    traceRootId: null, collapsedNodeIds: new Set(), traceSelectedNodeId: null,\n    impactSourceId: null,\n    compareTab: 'attributes', compareHighlightDiff: false,\n  };\n\n  fmtNum(n) { return n.toLocaleString('en-US'); }\n\n  toggleSegmentDropdown() {\n    if (this.state.openDropdown === 'segment') { this.setState({ openDropdown: null }); return; }\n    this.setState({ pendingSegments: new Set(this.state.appliedSegments), openDropdown: 'segment' });\n  }\n  toggleRegionDropdown() {\n    if (this.state.openDropdown === 'region') { this.setState({ openDropdown: null }); return; }\n    this.setState({ pendingRegions: new Set(this.state.appliedRegions), openDropdown: 'region' });\n  }\n  togglePendingSegment(s) {\n    const next = new Set(this.state.pendingSegments);\n    next.has(s) ? next.delete(s) : next.add(s);\n    this.setState({ pendingSegments: next });\n  }\n  togglePendingRegion(r) {\n    const next = new Set(this.state
